<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Gestão Industrial de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>TaskFlow</h1>
            <p>Gerenciamento de Fluxo de Trabalho</p>
        </header>
        
        <main>
            <section class="task-input">
                <input type="text" id="task-name" placeholder="Nova tarefa...">
                <button id="add-task">Adicionar</button>
            </section>
            
            <section class="task-list-container">
                <ul id="task-list"></ul>
            </section>
        </main>
        
        <footer>
            <p>&copy; 2024 TaskFlow - Tema Industrial</p>
        </footer>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/task.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
